services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: greenchain-backend
    env: python
    plan: free
    rootDir: greenchain-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # MongoDB Atlas connection string — set this in the Render dashboard
      # Format: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/greenchain?retryWrites=true&w=majority
      - key: MONGODB_URL
        sync: false
      # Optional alternative to MONGODB_URL (avoids URL-encoding issues with passwords)
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        value: greenchain.3dvyz3a.mongodb.net
      - key: MONGODB_DATABASE
        value: greenchain
      - key: MONGODB_OPTIONS
        value: retryWrites=true&w=majority&appName=GreenChain
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "8000"
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "8000"
      - key: MONGODB_SOCKET_TIMEOUT_MS
        value: "20000"
      - key: MONGODB_CONNECT_RETRIES
        value: "5"
      - key: MONGODB_CONNECT_RETRY_DELAY_SECONDS
        value: "3"
      - key: MONGODB_TLS_ALLOW_INVALID_CERTIFICATES
        value: "false"
      - key: MONGODB_TLS_ALLOW_INVALID_HOSTNAMES
        value: "false"

      # JWT — auto-generated on first deploy
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # Gemini AI — set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false

      # Gmail SMTP — set in Render dashboard
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        value: "15"

      - key: FRONTEND_URL
        value: https://greenchain-community-ecoaction-tracker.onrender.com,https://greenchain-community-ecoaction-tracker-dcqo.onrender.com

  # ── React Frontend (Static Site) ────────────────────────────────────────────
  - type: web
    name: greenchain-frontend
    env: static
    plan: free
    rootDir: greenchain-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://greenchain-community-ecoaction-tracker-dcqo.onrender.com
      # Avoid out-of-memory errors during React build on free tier
      - key: GENERATE_SOURCEMAP
        value: "false"
